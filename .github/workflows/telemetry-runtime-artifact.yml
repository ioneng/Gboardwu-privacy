name: Telemetry runtime artifact

on:
  push:
    branches:
      - validation/telemetry-runtime

jobs:
  build:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Morphe Desktop
        run: |
          mkdir -p runtime-tools
          curl -L --fail --retry 3 \
            -o runtime-tools/morphe-desktop-1.16.0-all.jar \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar
          echo '82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  runtime-tools/morphe-desktop-1.16.0-all.jar' | sha256sum -c -

      - name: Upload Morphe Desktop
        uses: actions/upload-artifact@v4
        with:
          name: morphe-desktop-runtime
          path: runtime-tools/morphe-desktop-1.16.0-all.jar
          if-no-files-found: error
